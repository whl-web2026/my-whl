<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>冰壶运动 - 冰上国际象棋</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; background-color: #f5f5f5; color: #333; line-height: 1.8; }
        .container { width: 1000px; margin: 0 auto; background: #fff; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        .top-nav { background-color: #333; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .top-nav a { color: #fff; text-decoration: none; font-size: 15px; }
        .top-nav a:hover { color: #0288d1; font-weight: bold; }
        /* 冰壶主题色，用了冰蓝色 */
        .page-header { background: linear-gradient(135deg, #01579b 0%, #0288d1 100%); color: white; padding: 40px 30px; text-align: center; }
        .page-header h1 { font-size: 36px; letter-spacing: 2px; }
        .content-area { padding: 40px 50px; }
        .intro-box { display: flex; gap: 30px; margin-bottom: 40px; }
        .intro-box img { width: 400px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); object-fit: cover; }
        .intro-text { flex: 1; }
        .intro-text h2 { color: #0288d1; border-bottom: 2px solid #0288d1; padding-bottom: 10px; margin-bottom: 20px; }
        .intro-text p { margin-bottom: 15px; color: #555; font-size: 16px; }
        footer { background: #333; color: #aaa; text-align: center; padding: 20px; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <div class="top-nav">
        <a href=" ">🏠 返回首页</a >
        <span style="color: #fff; font-size: 14px;">冰雪运动 - 中国健儿风采</span>
    </div>
    <div class="page-header">
        <h1>冰壶运动：冰上国际象棋</h1>
    </div>
    <div class="content-area">
        <div class="intro-box">
            <!-- 记得准备一张冰壶大图命名为 binghu_big.jpg -->
            < img src="binghu.jpg"alt="冰壶运动">
            <div class="intro-text">
                <h2>项目介绍</h2>
                <p>冰壶 (Curling)，又称掷冰壶、冰上溜石，是以队为单位在冰上进行的一种投掷性竞赛项目，冬奥会比赛项目，并设有冰壶世锦赛。</p >
                <p>设男女2个小项，每队为四人。冰壶周长约为91.44厘米，高（从壶的底部到顶部）11.43厘米，重量（包括壶柄和壶栓）最大为19.96公斤。</p >
                <p>刷冰是为了减小冰壶与冰面间摩擦。有人把冰壶称作“冰上国际象棋”，这一比喻很好地诠释了冰壶运动的神秘与高雅。</p >
            </div>
        </div>
    </div>
    <footer>
        <p>网页设计综合实训 · 冰雪运动主题 | 国家开放大学实验学院</p >
    </footer>
</div>
</body>
</html>
